# An extension: a folder bundling a hook behind one manifest. Copy to
# .edgar/extensions/ (this project) or ~/.edgar/extensions/ (everywhere), then
# run `edgar trust` and `edgar ext list`.
#
# Pairs with `schedule add`: an unattended run that cannot tell anyone it
# finished is not unattended, it is lost [SCH-10].
name = "schedule-notify"
version = "0.1.0"
description = "Posts a session's last reply to a webhook, or a desktop notification."
